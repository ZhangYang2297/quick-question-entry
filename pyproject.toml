[project]
name = "qqe"
version = "0.1.0"
description = "快速录题智能体：图片 -> 结构化题目 -> Word"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-docx>=1.1",
    "Pillow>=10.3",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<0.140",
    "uvicorn>=0.30,<0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

# 显式固定规则集：避免 ruff 版本升级悄悄改变默认规则，导致 "All checks passed" 时好时坏。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "RUF"]
# RUF001/002/003 是全角标点"歧义字符"检查：面向用户文案必须用中文标点，对本项目是纯噪声。
ignore = ["RUF001", "RUF002", "RUF003"]
